<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="100" cy="100" r="90"/>
    </clipPath>
  </defs>
  <!-- Fond -->
  <circle cx="100" cy="100" r="90" fill="#0B1829"/>
  <!-- Maison stylisée -->
  <polygon points="100,38 148,75 148,138 52,138 52,75" fill="none" stroke="#60A5FA" stroke-width="5" stroke-linejoin="round"/>
  <line x1="100" y1="38" x2="100" y2="138" stroke="none"/>
  <!-- Porte -->
  <rect x="84" y="104" width="32" height="34" rx="3" fill="#60A5FA" opacity="0.25"/>
  <rect x="84" y="104" width="32" height="34" rx="3" fill="none" stroke="#60A5FA" stroke-width="2.5"/>
  <!-- Graphique score (barres) -->
  <rect x="56" y="112" width="8" height="18" rx="2" fill="#1D4ED8" opacity="0.7"/>
  <rect x="68" y="98" width="8" height="32" rx="2" fill="#2563EB" opacity="0.8"/>
  <rect x="124" y="88" width="8" height="42" rx="2" fill="#60A5FA"/>
  <rect x="136" y="105" width="8" height="25" rx="2" fill="#60A5FA" opacity="0.6"/>
  <!-- Ligne de score -->
  <polyline points="60,108 72,95 100,85 128,84" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="128" cy="84" r="4" fill="#34D399"/>
  <!-- Texte BS -->
  <text x="100" y="165" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#F8FAFC" letter-spacing="2">BS</text>
</svg>
